<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15445a">
<title>دليل الموجّه — بوصلة التخصص</title>
<style>
:root{--ink:#15445a;--teal:#0da9a6;--green:#05623c;--muted:#5c686d;--line:#e0e6e9;--bg:#f3f6f7;--card:#fff;--warn:#8a2325;--amber:#6b4e00;--amberbg:#fff4d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#22333a;font-family:"Thmanyah Sans","Bahij TheSansArabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:0 16px 48px}
header{max-width:820px;margin:0 auto;padding:22px 0 12px;display:flex;flex-direction:column;gap:2px}
header .k{font-size:12.5px;font-weight:700;color:var(--teal)}
header h1{margin:0;font-size:25px;color:var(--ink)}
header .s{font-size:13px;color:var(--muted)}
main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:20px;box-shadow:0 6px 20px rgba(0,56,69,.10);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{margin:0;font-size:18px;color:var(--ink);line-height:1.5}
h3{margin:4px 0 0;font-size:14.5px;color:var(--ink)}
p{margin:0;font-size:14px;line-height:1.9}
.muted{color:var(--muted);font-size:12.5px;line-height:1.8}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{font-size:12.5px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;text-decoration:none}
.alert{background:var(--amberbg);color:var(--amber);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700;line-height:1.8}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
input{font:inherit;font-size:16px;color:#22333a;background:#fff;border:1px solid #cfd8db;border-radius:12px;padding:10px 12px;width:100%;direction:ltr;text-align:center}
input:focus{outline:2px solid var(--teal);outline-offset:1px}
.tbl{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl table{min-width:620px}
.tbl.sm table{min-width:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:right;vertical-align:middle;line-height:1.6}
th{background:#f3f8f9;color:var(--ink);font-size:12px}
td.c{text-align:center}
td input{font-size:14px;padding:6px 4px;min-width:62px}
.n{unicode-bidi:isolate;direction:ltr;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.big{font-size:18px;font-weight:700;color:var(--ink)}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.b-off{background:#e5f3ec;color:#05623c}.b-old{background:#fff4d6;color:#6b4e00}.b-est{background:#eef0f2;color:#4b585d}
.ok{color:#05623c;font-weight:700}.no{color:#8a2325;font-weight:700}
.east{background:#f7fbfb}
.lm{display:flex;flex-direction:column;gap:7px}
.lm .r{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.lm .r>span:first-child{font-weight:700}
.lm .v{font-weight:700;color:var(--ink);text-align:left}
.lm .t{height:9px;border-radius:99px;background:#e3eaec;overflow:hidden}
.lm .t i{display:block;height:100%;border-radius:99px;background:#0da9a6}
.lm .hl>span:first-child{color:var(--green)}.lm .hl .t i{background:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:20px;color:var(--ink)}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.7}
.path{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.path b{color:var(--ink)}
.path a{color:var(--teal);font-size:12.5px;font-weight:700}
ol,ul{margin:0;padding:0 20px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.8}
.btn{font:inherit;font-size:14px;font-weight:700;border:none;border-radius:99px;min-height:42px;padding:0 18px;cursor:pointer;background:var(--ink);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.hl-row td{background:#eef8f7}
footer{max-width:820px;margin:18px auto 0;font-size:11.5px;color:#8a979c;text-align:center;line-height:1.8}
@media (max-width:560px){.row,.grid2{grid-template-columns:1fr}header h1{font-size:22px}}
@media print{body{background:#fff;padding:0}.card{box-shadow:none;border:1px solid var(--line);break-inside:avoid}.nav,.noprint{display:none!important}}
</style>
</head>
<body>
<header>
  <span class="k">منصة تمهيد — للموجّه الطلابي</span>
  <h1>دليل الموجّه: سوق العمل والقبول</h1>
  <span class="s" id="upd"></span>
</header>
<main id="app"></main>
<footer>أداة استرشادية للموجّه الطلابي. الأرقام من مصادر رسمية منشورة، وقد تتغيّر صيغ القبول وحدوده كل عام؛ الدليل الرسمي لكل جامعة هو المرجع.</footer>
<script src="plus.js"></script>
<script>
(function () {
  'use strict';
  var P = window.BawsalaPlus, D = P.DATA, esc = P.esc, fmt = P.fmt;
  function n(x) { return '<span class="n">' + esc(x) + '</span>'; }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function bars(rows, max, hi, f) {
    return '<div class="lm">' + rows.map(function (r) {
      return '<div class="r' + (r[0] === hi ? ' hl' : '') + '"><span>' + esc(r[0]) + '</span><div class="t"><i style="width:' + (r[1] / max * 100).toFixed(1) + '%"></i></div><span class="v">' + n(f(r[1])) + '</span></div>';
    }).join('') + '</div>';
  }

  // تاريخ التحديث وتنبيه المراجعة
  document.getElementById('upd').textContent = 'آخر تحديث للأرقام: ' + D.updatedLabel;
  var due = new Date() > new Date(D.nextReview);

  var params = new URLSearchParams(location.search);
  var codeParam = (params.get('c') || '').toUpperCase().replace(/[^RIASEC]/g, '').slice(0, 3);
  var saved = store('bp.calc') || {};
  var mins = store('bp.mins') || {};

  var h = '';
  h += '<nav class="nav noprint"><a href="#calc">حاسبة النسبة الموزونة</a><a href="#map">الميول والمجالات</a><a href="#east">المنطقة الشرقية</a><a href="#paths">مسارات غير الجامعة</a><a href="#qual">قيمة المؤهل</a><a href="#retest">إعادة القياس</a><a href="#src">المصادر</a></nav>';
  if (due) h += '<div class="alert">مرّ موعد مراجعة الأرقام (' + esc(D.nextReview) + '). تحقّق من صدور بيانات أحدث من الهيئة العامة للإحصاء والمرصد الوطني للعمل، ومن أدلة القبول الجديدة.</div>';

  // 1) الحاسبة
  h += '<section class="card" id="calc"><h2>🧮 حاسبة النسبة الموزونة — جامعات الشرقية أولًا</h2>' +
    '<p class="muted">أدخل درجات الطالب لتُحسب نسبته الموزونة حسب صيغة كل جامعة. اكتب في عمود «الحد الأدنى» الرقم المعلن في دليل الجامعة لهذا العام ليظهر لك هل يتجاوزه؛ يُحفظ الرقم في هذا المتصفح فقط.</p>' +
    '<div class="row"><label>معدل الثانوية %<input id="g" inputmode="decimal" value="' + esc(saved.g || '') + '" placeholder="مثال 95"></label>' +
    '<label>درجة القدرات<input id="q" inputmode="decimal" value="' + esc(saved.q || '') + '" placeholder="مثال 80"></label>' +
    '<label>درجة التحصيلي<input id="t" inputmode="decimal" value="' + esc(saved.t || '') + '" placeholder="مثال 78"></label></div>' +
    '<div class="tbl"><table id="ct"></table></div>' +
    '<h3>الحد الأدنى في جامعة الملك فيصل (بنين) — آخر نسخة منشورة 1444–1445هـ</h3>' +
    '<div class="tbl sm"><table><tr><th>الكليات</th><th>الحد الأدنى للنسبة الموزونة</th></tr>' +
    D.kfuMin.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td class="c">' + n(r[1] + '%') + '</td></tr>'; }).join('') + '</table></div>' +
    '<p class="muted">الجامعات الأخرى خارج الشرقية: ' + D.otherUnis.map(esc).join('، ') + '. لكل جامعة صيغتها وحدودها في دليل القبول.</p></section>';

  // 2) الميول والمجالات
  h += '<section class="card" id="map"><h2>🧭 ربط ميول الطالب بمجالات الدراسة وسوق العمل</h2>' +
    '<div class="row noprint" style="grid-template-columns:minmax(0,220px)"><label>رمز هولاند للطالب (اختياري)<input id="code" maxlength="3" value="' + esc(codeParam) + '" placeholder="مثال RAC"></label></div>' +
    '<p class="muted">خريجو البكالوريوس السعوديون الذكور لعام 2023 وتوظيفهم حتى 2024، دون القطاع العسكري. تُظلَّل ميول الطالب إذا كتبت رمزه.</p>' +
    '<div class="tbl"><table id="mt"></table></div></section>';

  // 3) الشرقية
  var R = D.region;
  h += '<section class="card" id="east"><h2>📍 المنطقة الشرقية</h2><div class="grid2">' +
    '<div class="kpi"><b>' + n(R.unempEast + '%') + '</b><span>بطالة السعوديين الذكور في الشرقية (المملكة ' + n(R.unempKSA + '%') + ') — الربع الثاني 2026</span></div>' +
    '<div class="kpi"><b>' + n(R.empEast + '%') + '</b><span>نسبة المشتغلين من السعوديين الذكور في سن العمل (المملكة ' + n(R.empKSA + '%') + ')</span></div>' +
    '<div class="kpi"><b>' + n(R.youthPerUni) + ' ألفًا</b><span>شاب سعودي (20–24) لكل جامعة في الشرقية، والمتوسط ' + n(R.youthPerUniKSA) + ' ألفًا — تقدير من تعداد 2022</span></div>' +
    '<div class="kpi"><b>' + n(R.iau.empMale + '%') + '</b><span>خريجو جامعة الإمام عبدالرحمن الذكور الموظفون، متوسط الراتب ' + n(fmt(R.iau.payMale)) + ' ريالًا، والانتظار ' + n(R.iau.waitMale) + ' أشهر</span></div></div>' +
    '<h3>أعلى التخصصات توظيفًا في جامعة الإمام عبدالرحمن (ذكور وإناث)</h3><p>' + R.iau.top.map(function (x) { return esc(x[0]) + ' ' + n(x[1] + '%'); }).join(' · ') + '</p>' +
    '<p><b>نقطة للنقاش:</b> فرص العمل في الشرقية أفضل من المتوسط، لكن المنافسة على مقاعد الجامعات فيها أعلى. ناقش مع الطالب خطة بديلة: جامعة خارج المنطقة، أو كلية تقنية، أو دبلوم ثم تجسير.</p></section>';

  // 4) مسارات غير الجامعة
  h += '<section class="card" id="paths"><h2>🛠️ مسارات غير الجامعة — في الشرقية</h2>' +
    '<p class="muted">مناسبة للطالب الذي جاهزيته منخفضة، أو نسبته لا تكفي للتخصص الذي يريده، أو يفضّل العمل التطبيقي. الشروط والمواعيد تتغيّر كل عام؛ راجع الموقع الرسمي.</p>' +
    D.paths.map(function (p) { return '<div class="path"><b>' + esc(p.name) + '</b><span class="muted">' + esc(p.where) + '</span><p>' + esc(p.what) + '</p>' + (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">الموقع الرسمي ↗</a>' : '') + '</div>'; }).join('') +
    '<p class="muted">أجر حامل الدبلوم المشارك ' + n(fmt(10810)) + ' ريالًا مقابل ' + n(fmt(9277)) + ' لحامل الثانوي (السعوديون الذكور، الربع الثاني 2026).</p></section>';

  // 5) قيمة المؤهل
  h += '<section class="card" id="qual"><h2>📊 قيمة المؤهل في سوق العمل</h2><p class="muted">' + esc(D.qual.source) + '</p>' +
    '<h3>متوسط الأجر الشهري (ريال)</h3>' + bars(D.qual.wage, 32094, 'بكالوريوس', fmt) +
    '<h3>نسبة البطالة</h3>' + bars(D.qual.unemp, 8, 'بكالوريوس', function (x) { return x + '%'; }) + '</section>';

  // 6) إعادة القياس
  h += '<section class="card" id="retest"><h2>🔁 إعادة القياس ومتابعة التقدّم</h2><ol>' +
    '<li>بعد الجلسات الإرشادية (الفصل الثاني مثلًا)، أرسل رابط البوصلة للطلاب أنفسهم مرة أخرى.</li>' +
    '<li>المنصة تحفظ كل تعبئة في «سجل الطلاب» ولا تحذف السابقة، فافتح التعبئتين للطالب نفسه وقارن «نضج اتخاذ القرار» محورًا محورًا.</li>' +
    '<li>ركّز على المحور الأضعف في المرة الأولى: هل تحسّن؟ ومن لم يتحسّن يحتاج جلسة فردية.</li>' +
    '<li>عدد من تحسّنت جاهزيتهم شاهد جيد على أثر برنامجك الإرشادي في تقاريرك.</li></ol></section>';

  // 7) المصادر
  h += '<section class="card" id="src"><h2>📚 المصادر</h2><ul>' +
    '<li>' + esc(D.fieldsSource) + '</li><li>' + esc(D.qual.source) + '</li>' +
    '<li>د. علي بن سليمان الفوزان، «قراءة في توزيع مؤسسات التعليم العالي» (نوفمبر 2026)، تقديرات من تعداد السعودية 2022.</li>' +
    '<li>صيغ النسب الموزونة: بوابة القبول في جامعة الإمام عبدالرحمن بن فيصل، وصفحة مسارات القبول في جامعة الملك فهد للبترول والمعادن، وصفحة شروط القبول في جامعة الملك فيصل.</li></ul>' +
    '<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="print">طباعة الدليل</button><a class="btn sec" href="../" style="display:inline-flex;align-items:center;text-decoration:none">العودة إلى المنصة</a></div></section>';

  document.getElementById('app').innerHTML = h;

  function val(id) { var v = parseFloat(String(document.getElementById(id).value).replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x660; }).replace(',', '.')); return isNaN(v) ? null : Math.max(0, Math.min(100, v)); }

  function renderCalc() {
    var g = val('g'), q = val('q'), t = val('t');
    store('bp.calc', { g: document.getElementById('g').value, q: document.getElementById('q').value, t: document.getElementById('t').value });
    var rows = '<tr><th>الجامعة</th><th>الصيغة (ثانوية / قدرات / تحصيلي)</th><th>النسبة الموزونة</th><th>الحد الأدنى</th><th>الحالة</th></tr>';
    D.unis.forEach(function (u) {
      u.f.forEach(function (f, i) {
        var need = [f.g ? g : 0, f.q ? q : 0, f.t ? t : 0], missing = (f.g && g == null) || (f.q && q == null) || (f.t && t == null);
        var w = missing ? null : (f.g * (g || 0) + f.q * (q || 0) + f.t * (t || 0)) / 100;
        var key = u.id + ':' + i, m = mins[key];
        var stt = (w == null || m == null || m === '') ? '—' : (w >= +m ? '<span class="ok">يتجاوزه</span>' : '<span class="no">أقل بـ ' + n((+m - w).toFixed(2)) + '</span>');
        var badge = u.status === 'رسمي' ? 'b-off' : (u.status.indexOf('آخر نسخة') === 0 ? 'b-old' : 'b-est');
        rows += '<tr class="' + (u.east ? 'east' : '') + '">' +
          (i === 0 ? '<td rowspan="' + u.f.length + '"><b>' + esc(u.name) + '</b><br><span class="muted">' + esc(u.city) + '</span><br><span class="badge ' + badge + '">' + esc(u.status) + '</span>' + (u.url ? ' <a class="muted noprint" href="' + esc(u.url) + '" target="_blank" rel="noopener">الموقع ↗</a>' : '') + '</td>' : '') +
          '<td>' + esc(f.label) + '<br><span class="n">' + f.g + ' / ' + f.q + ' / ' + f.t + '</span></td>' +
          '<td class="c"><span class="big">' + (w == null ? '—' : n(w.toFixed(2) + '%')) + '</span></td>' +
          '<td class="c"><input data-min="' + esc(key) + '" inputmode="decimal" value="' + esc(m == null ? '' : m) + '" placeholder="—"></td>' +
          '<td class="c">' + stt + '</td></tr>';
        if (i === u.f.length - 1 && u.note) rows += '<tr class="' + (u.east ? 'east' : '') + '"><td colspan="5" class="muted">' + esc(u.note) + '</td></tr>';
      });
    });
    document.getElementById('ct').innerHTML = rows;
    Array.prototype.forEach.call(document.querySelectorAll('[data-min]'), function (el) {
      el.onchange = function () { var v = el.value.trim(); if (v === '') delete mins[el.getAttribute('data-min')]; else mins[el.getAttribute('data-min')] = parseFloat(v); store('bp.mins', mins); setTimeout(renderCalc, 0); };
    });
  }

  function renderMap() {
    var code = (document.getElementById('code').value || '').toUpperCase().replace(/[^RIASEC]/g, '').slice(0, 3);
    var rows = '<tr><th>الميل</th><th>المجال</th><th>يعملون</th><th>أول راتب</th><th>انتظار (شهر)</th><th>أين في الشرقية</th></tr>';
    var order = code ? code.split('').concat('RIASEC'.split('').filter(function (k) { return code.indexOf(k) < 0; })) : 'RIASEC'.split('');
    order.forEach(function (k) {
      var hh = D.holland[k], on = code.indexOf(k) > -1;
      hh.fields.forEach(function (fk, i) {
        var f = D.fields[fk];
        rows += '<tr class="' + (on ? 'hl-row' : '') + '">' + (i === 0 ? '<td rowspan="' + hh.fields.length + '"><b>' + esc(hh.name) + '</b> <span class="n muted">' + k + '</span></td>' : '') +
          '<td>' + esc(f.name) + (f.small ? ' *' : '') + '</td><td class="c">' + n(f.emp + '%') + '</td><td class="c">' + n(fmt(f.pay)) + '</td><td class="c">' + n(f.wait) + '</td>' +
          '<td class="muted">' + (D.eastern[fk] || []).map(esc).join('، ') + '</td></tr>';
      });
    });
    document.getElementById('mt').innerHTML = rows + '<tr><td colspan="6" class="muted">* عدد الخريجين قليل، فلا يُبنى عليه حكم. قائمة «أين في الشرقية» استرشادية؛ تحقّق من البرامج المتاحة في دليل كل جامعة.</td></tr>';
  }

  ['g', 'q', 't'].forEach(function (id) { document.getElementById(id).oninput = renderCalc; });
  document.getElementById('code').oninput = renderMap;
  document.getElementById('print').onclick = function () { window.print(); };
  renderCalc(); renderMap();
})();
</script>
</body>
</html>
